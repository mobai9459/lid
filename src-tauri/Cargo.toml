[package]
name = "lid-switch"
version = "0.1.0"
description = "合盖睡眠助手 - 切换 macOS 合盖是否睡眠"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lid_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
